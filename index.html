<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10364a">
  <meta name="description" content="Log miles, hours, earnings, and expenses on this device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <title>MileQuill Lite</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/touch.png">
  <link rel="stylesheet" href="./styles.css">
  
<link rel="stylesheet" href="./terms.css"><script type="module" src="./terms-entry.mjs"></script>
</head>
<body>
<p id="terms-loading">Opening Terms of Service…</p><noscript>Enable JavaScript to open this app.</noscript>
<template id="application-template" data-entry="./app.js">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#dashboard" aria-label="MileQuill Lite dashboard">
        <img src="./assets/icon-192.png" width="38" height="38" alt="">
        <span>MileQuill <small>Lite</small></span>
      </a>
      <div class="top-actions">
        <button type="button" class="update" id="update" hidden>Apply update</button>
        <span class="connection"><span class="dot" id="status-dot"></span><span id="offline-status">Checking offline setup</span></span>
      </div>
    </div>
  </header>
  <div class="shell">
    <nav class="navigation" aria-label="Main navigation">
      <a href="#dashboard" data-page="dashboard"><span data-icon="dashboard"></span>Overview</a>
      <a href="#trips" data-page="trips"><span data-icon="trips"></span>Trips</a>
      <a href="#shifts" data-page="shifts"><span data-icon="shifts"></span>Shifts</a>
      <a href="#expenses" data-page="expenses"><span data-icon="expenses"></span>Expenses</a>
      <a href="#data" data-page="data"><span data-icon="data"></span>Data</a>
    </nav>
    <main id="main" tabindex="-1">
      <noscript><p class="alert">Enable JavaScript to use MileQuill Lite and access saved records.</p></noscript>
      <p id="storage-error" class="alert" role="alert" hidden></p>
      <section id="view-dashboard" aria-labelledby="dashboard-title">
        <div class="section-heading dashboard-heading">
          <div>
            <h1 id="dashboard-title" tabindex="-1">Overview</h1>
            <p class="subtitle">Your mileage, work, and earnings at a glance.</p>
          </div>
          <button class="primary" type="button" data-add="trips" data-requires-storage><span data-icon="plus"></span>Log trip</button>
        </div>
        <section class="period" aria-label="Date range">
          <div class="segments" role="group" aria-label="Reporting period">
            <button type="button" data-period="week" aria-pressed="true">Week</button>
            <button type="button" data-period="month" aria-pressed="false">Month</button>
            <button type="button" data-period="custom" aria-pressed="false">Custom</button>
          </div>
          <div id="period-navigation" class="period-navigation">
            <button type="button" id="period-back" class="icon-button" aria-label="Previous week"><span data-icon="left"></span></button>
            <output id="range-label"></output>
            <button type="button" id="period-forward" class="icon-button" aria-label="Next week"><span data-icon="right"></span></button>
          </div>
          <form id="custom-range" class="custom-range" hidden>
            <label>From<input type="date" name="from" min="0001-01-01" max="9999-12-31" required></label>
            <label>Through<input type="date" name="through" min="0001-01-01" max="9999-12-31" required></label>
            <button type="submit" class="secondary">Apply</button>
            <p id="range-error" class="field-message" role="alert" hidden></p>
          </form>
          <p id="custom-applied" class="custom-applied" hidden></p>
        </section>
        <div class="summary">
          <section class="net-card" aria-label="Net estimates">
            <div class="net-main">
              <div class="hero-icon" data-icon="net"></div>
              <div>
                <h2>Estimated net</h2>
                <p class="net-value" id="net">—</p>
                <p class="net-caption">Gross earnings less logged expenses</p>
              </div>
            </div>
            <div class="net-hour">
              <h2>Net per hour</h2>
              <p id="per-hour">—</p>
              <span id="per-hour-hint">When hours are logged</span>
            </div>
          </section>
          <section class="metrics" aria-label="Tracker totals">
            <div class="metric"><span class="metric-icon teal" data-icon="trips"></span><h2>Miles</h2><p id="miles">—</p></div>
            <div class="metric"><span class="metric-icon blue" data-icon="shifts"></span><h2>Hours</h2><p id="hours">—</p></div>
            <div class="metric"><span class="metric-icon green" data-icon="cash"></span><h2>Gross earnings</h2><p id="gross">—</p></div>
            <div class="metric"><span class="metric-icon sand" data-icon="expenses"></span><h2>Logged expenses</h2><p id="spent">—</p></div>
          </section>
          <p class="footnote"><span data-icon="info"></span>Tracker totals only. These figures are not for tax calculations.</p>
        </div>
        <section class="activity" aria-labelledby="activity-title">
          <div class="activity-heading">
            <div><h2 id="activity-title">Recent activity</h2><p class="subtitle">Latest entries in this date range.</p></div>
            <div class="quick-actions">
              <button class="secondary" type="button" data-add="shifts" data-requires-storage><span data-icon="plus"></span>Log shift</button>
              <button class="secondary" type="button" data-add="expenses" data-requires-storage><span data-icon="plus"></span>Log expense</button>
            </div>
          </div>
          <div id="recent"></div>
        </section>
      </section>
      <section id="view-records" aria-labelledby="records-title" hidden>
        <div class="section-heading">
          <div><h1 id="records-title" tabindex="-1"></h1><p class="subtitle" id="records-intro"></p></div>
          <button type="button" id="add-record" class="primary" data-add="trips" data-requires-storage><span data-icon="plus"></span><span id="add-label"></span></button>
        </div>
        <div id="record-list"></div>
      </section>
      <section id="view-data" aria-labelledby="data-title" hidden>
        <div class="section-heading">
          <div><h1 id="data-title" tabindex="-1">Your data</h1><p class="subtitle">Download your records or restore a MileQuill Lite backup.</p></div>
        </div>
        <div class="data-layout">
          <section class="panel">
            <span class="metric-icon teal" data-icon="data"></span>
            <h2>Backup and restore</h2>
            <p>A full JSON backup contains all trips, shifts, and expenses in plain text. Keep it somewhere you control.</p>
            <div class="data-actions">
              <button class="primary" id="backup" type="button" data-requires-storage>Download JSON backup</button>
              <button class="secondary" id="choose-restore" type="button" data-requires-storage>Choose backup to restore</button>
              <input id="restore-file" type="file" accept=".json,application/json" hidden>
            </div>
            <p class="field-message" id="restore-error" role="alert" hidden></p>
          </section>
          <section class="panel">
            <span class="metric-icon blue" data-icon="download"></span>
            <h2>Export to CSV</h2>
            <p>Each CSV contains all saved entries of that type.</p>
            <div class="data-actions">
              <button class="secondary" data-export="trips" type="button" data-requires-storage>Export trips</button>
              <button class="secondary" data-export="shifts" type="button" data-requires-storage>Export shifts</button>
              <button class="secondary" data-export="expenses" type="button" data-requires-storage>Export expenses</button>
            </div>
          </section>
          <section class="privacy-note">
            <span data-icon="info"></span>
            <div><h2>Storage on this device</h2>
              <p>Clearing website data or changing devices can remove access to saved records. Safari tabs and a Home Screen installation may keep separate records. Back up from the browser or installation where you logged them.</p>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="entry-form">
      <div class="dialog-heading">
        <h2 id="editor-title"></h2>
        <button class="icon-button" type="button" data-close-editor aria-label="Close editor"><span data-icon="close"></span></button>
      </div>
      <div class="dialog-content">
        <div class="form-grid">
          <label>Date<input type="date" name="date" required min="0001-01-01" max="9999-12-31"></label>
          <label><span id="entry-label"></span><input name="label" type="text" maxlength="80" required></label>
        </div>
        <div id="entry-fields"></div>
        <label class="notes-label">Notes <span class="optional">(optional)</span><textarea name="notes" rows="2" maxlength="1000"></textarea></label>
        <p id="entry-error" class="field-message" role="alert" hidden></p>
      </div>
      <div class="dialog-actions">
        <button class="secondary" type="button" data-close-editor>Cancel</button>
        <button class="primary" id="save" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirmation" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form id="confirm-form">
      <div class="dialog-heading"><h2 id="confirm-title"></h2></div>
      <div class="dialog-content">
        <p id="confirm-message"></p>
        <p id="confirm-error" class="field-message" role="alert" hidden></p>
      </div>
      <div class="dialog-actions">
        <button class="secondary" id="cancel-confirm" type="button" autofocus>Cancel</button>
        <button class="danger" id="confirm-action" type="submit"></button>
      </div>
    </form>
  </dialog>
</template>
</body>
</html>
